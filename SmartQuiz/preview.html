<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Test Results Dashboard</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
    
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #0a0a0f;
      color: #ffffff;
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
    }
    
    /* Animated background */
    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: 
        radial-gradient(circle at 20% 80%, rgba(120, 119, 198, 0.3) 0%, transparent 50%),
        radial-gradient(circle at 80% 20%, rgba(255, 119, 198, 0.3) 0%, transparent 50%),
        radial-gradient(circle at 40% 40%, rgba(120, 219, 255, 0.2) 0%, transparent 50%);
      z-index: -2;
    }
    
    /* Floating orbs animation */
    .orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(2px);
      z-index: -1;
      pointer-events: none;
    }
    
    .orb1 {
      width: 400px;
      height: 400px;
      background: linear-gradient(45deg, #667eea, #764ba2);
      top: -200px;
      right: -200px;
      animation: float1 20s infinite ease-in-out;
    }
    
    .orb2 {
      width: 300px;
      height: 300px;
      background: linear-gradient(45deg, #f093fb, #f5576c);
      bottom: -150px;
      left: -150px;
      animation: float2 15s infinite ease-in-out;
    }
    
    @keyframes float1 {
      0%, 100% { transform: translate(0, 0) rotate(0deg); }
      50% { transform: translate(-100px, 100px) rotate(180deg); }
    }
    
    @keyframes float2 {
      0%, 100% { transform: translate(0, 0) rotate(0deg); }
      50% { transform: translate(100px, -100px) rotate(-180deg); }
    }
    
    .main-container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 40px 20px;
      position: relative;
      z-index: 1;
    }
    
    .header {
      text-align: center;
      margin-bottom: 50px;
      animation: slideDown 0.8s ease-out;
    }
    
    .header h1 {
      font-size: clamp(2.5rem, 5vw, 4rem);
      font-weight: 800;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 20px;
      letter-spacing: -0.02em;
    }
    
    .subtitle {
      font-size: 1.2rem;
      color: #a0a0a0;
      font-weight: 400;
    }
    
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 30px;
      margin-bottom: 50px;
    }
    
    .stat-card {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 30px;
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
      animation: fadeInUp 0.6s ease-out forwards;
      opacity: 0;
      transform: translateY(30px);
    }
    
    .stat-card:nth-child(1) { animation-delay: 0.1s; }
    .stat-card:nth-child(2) { animation-delay: 0.2s; }
    .stat-card:nth-child(3) { animation-delay: 0.3s; }
    
    .stat-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(90deg, #667eea, #764ba2, #f093fb);
      transform: scaleX(0);
      transition: transform 0.3s ease;
    }
    
    .stat-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
      border-color: rgba(255, 255, 255, 0.2);
    }
    
    .stat-card:hover::before {
      transform: scaleX(1);
    }
    
    .stat-title {
      font-size: 0.9rem;
      color: #a0a0a0;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 15px;
    }
    
    .stat-value {
      font-size: 2.5rem;
      font-weight: 800;
      color: #ffffff;
      margin-bottom: 15px;
      background: linear-gradient(135deg, #667eea, #f093fb);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    
    .stat-details {
      color: #b0b0b0;
      font-size: 0.95rem;
      line-height: 1.6;
    }
    
    .stat-details p {
      margin: 8px 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    
    .stat-label {
      font-weight: 500;
    }
    
    .stat-number {
      font-weight: 700;
      color: #ffffff;
    }
    
    .section-card {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 15px;
      padding: 20px;
      margin: 15px 0;
      transition: all 0.3s ease;
    }
    
    .section-card:hover {
      background: rgba(255, 255, 255, 0.06);
      border-color: rgba(255, 255, 255, 0.15);
    }
    
    .section-name {
      font-size: 1.1rem;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    
    .section-name::before {
      content: '';
      width: 4px;
      height: 20px;
      background: linear-gradient(135deg, #667eea, #f093fb);
      border-radius: 2px;
    }
    
    .chart-container {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 30px;
      margin-bottom: 50px;
      animation: fadeInUp 0.6s ease-out 0.4s forwards;
      opacity: 0;
      transform: translateY(30px);
    }
    
    .chart-title {
      text-align: center;
      font-size: 1.3rem;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 25px;
    }
    
    .question-overview {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 30px;
      animation: fadeInUp 0.6s ease-out 0.5s forwards;
      opacity: 0;
      transform: translateY(30px);
    }
    
    .grid-title {
      font-size: 1.3rem;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 25px;
      text-align: center;
    }
    
    .grid-subtitle {
      color: #a0a0a0;
      font-size: 0.9rem;
      text-align: center;
      margin-bottom: 30px;
    }
    
    .question-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(50px, 1fr));
      gap: 12px;
      max-height: 400px;
      overflow-y: auto;
      padding: 10px;
    }
    
    .question-btn {
      width: 50px;
      height: 50px;
      border: none;
      border-radius: 12px;
      font-weight: 700;
      font-size: 0.9rem;
      color: #ffffff;
      cursor: pointer;
      position: relative;
      transition: all 0.3s ease;
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
    
    .question-btn.correct {
      background: linear-gradient(135deg, #00c851, #00a041);
      box-shadow: 0 8px 20px rgba(0, 200, 81, 0.3);
    }
    
    .question-btn.incorrect {
      background: linear-gradient(135deg, #ff4757, #ff3838);
      box-shadow: 0 8px 20px rgba(255, 71, 87, 0.3);
    }
    
    .question-btn.unanswered {
      background: linear-gradient(135deg, #6c757d, #5a6268);
      box-shadow: 0 8px 20px rgba(108, 117, 125, 0.3);
    }
    
    .question-btn:hover {
      transform: translateY(-3px) scale(1.05);
      box-shadow: 0 12px 25px rgba(0, 0, 0, 0.4);
    }
    
    .tooltip {
      position: absolute;
      background: rgba(0, 0, 0, 0.9);
      backdrop-filter: blur(20px);
      color: #ffffff;
      padding: 15px 18px;
      border-radius: 12px;
      font-size: 0.85rem;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      top: -120px;
      left: 50%;
      transform: translateX(-50%);
      opacity: 0;
      visibility: hidden;
      transition: all 0.3s ease;
      z-index: 1000;
      min-width: 200px;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
    
    .tooltip::after {
      content: '';
      position: absolute;
      top: 100%;
      left: 50%;
      transform: translateX(-50%);
      border: 8px solid transparent;
      border-top-color: rgba(0, 0, 0, 0.9);
    }
    
    .question-btn:hover .tooltip {
      opacity: 1;
      visibility: visible;
      transform: translateX(-50%) translateY(-5px);
    }
    
    .tooltip-row {
      display: flex;
      justify-content: space-between;
      margin: 5px 0;
      padding: 2px 0;
    }
    
    .tooltip-label {
      font-weight: 600;
      color: #b0b0b0;
    }
    
    .tooltip-value {
      font-weight: 700;
      color: #ffffff;
    }
    
    .performance-indicator {
      display: inline-block;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-top: 10px;
    }
    
    .excellent {
      background: linear-gradient(135deg, #00c851, #00a041);
      color: white;
    }
    
    .good {
      background: linear-gradient(135deg, #ffbb33, #ff8800);
      color: white;
    }
    
    .needs-improvement {
      background: linear-gradient(135deg, #ff4757, #ff3838);
      color: white;
    }
    
    .progress-bar {
      width: 100%;
      height: 8px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 4px;
      overflow: hidden;
      margin: 15px 0;
    }
    
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #667eea, #764ba2);
      border-radius: 4px;
      transition: width 1.5s ease-out;
      width: 0;
    }
    
    .legend {
      display: flex;
      justify-content: center;
      gap: 25px;
      margin: 25px 0;
      flex-wrap: wrap;
    }
    
    .legend-item {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.9rem;
      font-weight: 500;
    }
    
    .legend-color {
      width: 16px;
      height: 16px;
      border-radius: 4px;
    }
    
    .correct-color { background: linear-gradient(135deg, #00c851, #00a041); }
    .incorrect-color { background: linear-gradient(135deg, #ff4757, #ff3838); }
    .unanswered-color { background: linear-gradient(135deg, #6c757d, #5a6268); }
    
    /* Animations */
    @keyframes slideDown {
      from {
        opacity: 0;
        transform: translateY(-30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    
    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    
    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.05); }
      100% { transform: scale(1); }
    }
    
    .pulse {
      animation: pulse 2s infinite;
    }
    
    /* Responsive design */
    @media (max-width: 768px) {
      .stats-grid {
        grid-template-columns: 1fr;
        gap: 20px;
      }
      
      .question-grid {
        grid-template-columns: repeat(auto-fill, minmax(45px, 1fr));
        gap: 8px;
      }
      
      .question-btn {
        width: 45px;
        height: 45px;
        font-size: 0.8rem;
      }
      
      .tooltip {
        min-width: 180px;
        font-size: 0.8rem;
        padding: 12px 15px;
      }
      
      .legend {
        gap: 15px;
      }
      
      .legend-item {
        font-size: 0.8rem;
      }
    }
    
    /* Custom scrollbar */
    .question-grid::-webkit-scrollbar {
      width: 6px;
    }
    
    .question-grid::-webkit-scrollbar-track {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 3px;
    }
    
    .question-grid::-webkit-scrollbar-thumb {
      background: linear-gradient(135deg, #667eea, #764ba2);
      border-radius: 3px;
    }
    
    .chart-canvas {
      max-width: 350px;
      margin: 0 auto;
    }
    
    .loading {
      text-align: center;
      color: #a0a0a0;
      font-size: 1.1rem;
      margin: 50px 0;
    }
    
    .error-state {
      text-align: center;
      color: #ff4757;
      font-size: 1.1rem;
      margin: 50px 0;
      padding: 30px;
      background: rgba(255, 71, 87, 0.1);
      border: 1px solid rgba(255, 71, 87, 0.3);
      border-radius: 15px;
    }
  </style>
</head>
<body>
  <div class="orb orb1"></div>
  <div class="orb orb2"></div>
  
  <div class="main-container">
    <header class="header">
      <h1>Test Results</h1>
      <p class="subtitle" id="result-message">Analyzing your performance...</p>
    </header>
    
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-title">Total Score</div>
        <div class="stat-value" id="total-score">--</div>
        <div class="progress-bar">
          <div class="progress-fill" id="score-progress"></div>
        </div>
        <div id="performance-indicator"></div>
      </div>
      
      <div class="stat-card">
        <div class="stat-title">Question Breakdown</div>
        <div class="stat-details" id="question-breakdown">
          <p><span class="stat-label">Correct:</span> <span class="stat-number" id="correct-count">--</span></p>
          <p><span class="stat-label">Incorrect:</span> <span class="stat-number" id="incorrect-count">--</span></p>
          <p><span class="stat-label">Unanswered:</span> <span class="stat-number" id="unanswered-count">--</span></p>
        </div>
      </div>
      
      <div class="stat-card">
        <div class="stat-title">Section Performance</div>
        <div class="stat-details" id="section-performance">
          Loading sections...
        </div>
      </div>
    </div>
    
    <div class="chart-container">
      <h3 class="chart-title">Performance Overview</h3>
      <div class="chart-canvas">
        <canvas id="resultChart"></canvas>
      </div>
      <div class="legend">
        <div class="legend-item">
          <div class="legend-color correct-color"></div>
          <span>Correct</span>
        </div>
        <div class="legend-item">
          <div class="legend-color incorrect-color"></div>
          <span>Incorrect</span>
        </div>
        <div class="legend-item">
          <div class="legend-color unanswered-color"></div>
          <span>Unanswered</span>
        </div>
      </div>
    </div>
    
    <div class="question-overview">
      <h3 class="grid-title">Question Analysis</h3>
      <p class="grid-subtitle">Hover over any question number to see details</p>
      <div class="question-grid" id="question-grid"></div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
  <script>
    // Simulate loading delay for smooth animation
    setTimeout(() => {
      loadTestResults();
    }, 500);
    
    function loadTestResults() {
      // Get data from sessionStorage (fallback to demo data if missing)
      let scoreData, userAnswers, questionsData;
      
      try {
        scoreData = JSON.parse(sessionStorage.getItem('testScore'));
        userAnswers = JSON.parse(sessionStorage.getItem('testAnswers'));
        questionsData = JSON.parse(sessionStorage.getItem('questionsData'));
      } catch (e) {
        // Demo data for preview
        scoreData = {
          score: 142,
          totalQuestions: 50,
          correctAnswers: 38,
          incorrectAnswers: 8,
          unanswered: 4,
          sectionStats: {
            'Mathematics': { correct: 15, incorrect: 3, unanswered: 2 },
            'Science': { correct: 12, incorrect: 2, unanswered: 1 },
            'English': { correct: 11, incorrect: 3, unanswered: 1 }
          }
        };
        userAnswers = {};
        questionsData = {};
        
        // Generate demo questions
        let questionNum = 1;
        ['Mathematics', 'Science', 'English'].forEach(section => {
          questionsData[section] = [];
          userAnswers[section] = [];
          const stats = scoreData.sectionStats[section];
          const totalQuestions = stats.correct + stats.incorrect + stats.unanswered;
          
          for (let i = 0; i < totalQuestions; i++) {
            questionsData[section].push({
              question: `Sample question ${questionNum}`,
              correctOption: 'A'
            });
            
            if (i < stats.correct) {
              userAnswers[section].push({ answer: 'A' });
            } else if (i < stats.correct + stats.incorrect) {
              userAnswers[section].push({ answer: 'B' });
            } else {
              userAnswers[section].push({ answer: null });
            }
            questionNum++;
          }
        });
      }
      
      if (!scoreData) {
        document.getElementById('result-message').textContent = 'No test data found. Please take a test first.';
        document.getElementById('result-message').className = 'error-state';
        return;
      }
      
      // Update UI elements
      const percentage = Math.round((scoreData.score / (scoreData.totalQuestions * 4)) * 100);
      
      document.getElementById('result-message').textContent = 'Test completed successfully!';
      document.getElementById('total-score').textContent = `${scoreData.score} / ${scoreData.totalQuestions * 4}`;
      document.getElementById('correct-count').textContent = scoreData.correctAnswers || 0;
      document.getElementById('incorrect-count').textContent = scoreData.incorrectAnswers || 0;
      document.getElementById('unanswered-count').textContent = scoreData.unanswered || 0;
      
      // Animate progress bar
      setTimeout(() => {
        document.getElementById('score-progress').style.width = `${percentage}%`;
      }, 1000);
      
      // Performance indicator
      const indicator = document.getElementById('performance-indicator');
      if (percentage >= 80) {
        indicator.innerHTML = '<span class="performance-indicator excellent">Excellent</span>';
      } else if (percentage >= 60) {
        indicator.innerHTML = '<span class="performance-indicator good">Good</span>';
      } else {
        indicator.innerHTML = '<span class="performance-indicator needs-improvement">Needs Improvement</span>';
      }
      
      // Section performance
      const sectionPerformance = document.getElementById('section-performance');
      if (scoreData.sectionStats) {
        let html = '';
        Object.entries(scoreData.sectionStats).forEach(([section, stats]) => {
          const total = stats.correct + stats.incorrect + stats.unanswered;
          const sectionPercentage = Math.round((stats.correct / total) * 100);
          html += `
            <div class="section-card">
              <div class="section-name">${section}</div>
              <p><span class="stat-label">Accuracy:</span> <span class="stat-number">${sectionPercentage}%</span></p>
              <p><span class="stat-label">Correct:</span> <span class="stat-number">${stats.correct}/${total}</span></p>
            </div>
          `;
        });
        sectionPerformance.innerHTML = html;
      } else {
        sectionPerformance.innerHTML = '<p>No section data available</p>';
      }
      
      // Create question grid
      createQuestionGrid(questionsData, userAnswers);
      
      // Create chart
      createChart(scoreData);
    }
    
    function createQuestionGrid(questionsData, userAnswers) {
      const grid = document.getElementById('question-grid');
      let questionNum = 1;
      
      Object.keys(questionsData).forEach(section => {
        questionsData[section].forEach((question, idx) => {
          const userAnswer = userAnswers[section]?.[idx]?.answer ?? null;
          const correctAnswer = question.correctOption;
          
          const btn = document.createElement('button');
          btn.className = 'question-btn';
          btn.textContent = questionNum;
          
          if (userAnswer === null) {
            btn.classList.add('unanswered');
          } else if (userAnswer === correctAnswer) {
            btn.classList.add('correct');
          } else {
            btn.classList.add('incorrect');
          }
          
          const tooltip = document.createElement('div');
          tooltip.className = 'tooltip';
          tooltip.innerHTML = `
            <div class="tooltip-row">
              <span class="tooltip-label">Section:</span>
              <span class="tooltip-value">${section}</span>
            </div>
            <div class="tooltip-row">
              <span class="tooltip-label">Your Answer:</span>
              <span class="tooltip-value">${userAnswer || 'Not Answered'}</span>
            </div>
            <div class="tooltip-row">
              <span class="tooltip-label">Correct:</span>
              <span class="tooltip-value">${correctAnswer}</span>
            </div>
          `;
          
          btn.appendChild(tooltip);
          grid.appendChild(btn);
          questionNum++;
        });
      });
    }
    
    function createChart(scoreData) {
      const ctx = document.getElementById('resultChart').getContext('2d');
      
      const data = {
        labels: ['Correct', 'Incorrect', 'Unanswered'],
        datasets: [{
          data: [
            scoreData.correctAnswers || 0,
            scoreData.incorrectAnswers || 0,
            scoreData.unanswered || 0
          ],
          backgroundColor: [
            'rgba(0, 200, 81, 0.9)',
            'rgba(255, 71, 87, 0.9)',
            'rgba(108, 117, 125, 0.9)'
          ],
          borderColor: [
            'rgba(0, 200, 81, 1)',
            'rgba(255, 71, 87, 1)',
            'rgba(108, 117, 125, 1)'
          ],
          borderWidth: 2,
          hoverOffset: 15
        }]
      };
      
      const config = {
        type: 'doughnut',
        data: data,
        options: {
          responsive: true,
          maintainAspectRatio: true,
          plugins: {
            legend: {
              display: false
            },
            tooltip: {
              backgroundColor: 'rgba(0, 0, 0, 0.9)',
              titleColor: '#ffffff',
              bodyColor: '#ffffff',
              borderColor: 'rgba(255, 255, 255, 0.2)',
              borderWidth: 1,
              cornerRadius: 10,
              displayColors: false,
              callbacks: {
                label: function(context) {
                  const total = context.dataset.data.reduce((a, b) => a + b, 0);
                  const percentage = Math.round((context.parsed / total) * 100);
                  return `${context.label}: ${context.parsed} (${percentage}%)`;
                }
              }
            }
          },
          cutout: '60%',
          animation: {
            animateRotate: true,
            animateScale: true,
            duration: 1500,
            easing: 'easeOutCubic'
          }
        }
      };
      
      new Chart(ctx, config);
    }
    
    // Add smooth scroll behavior
    document.documentElement.style.scrollBehavior = 'smooth';
    
    // Add entrance animations with staggered delays
    window.addEventListener('load', () => {
      const cards = document.querySelectorAll('.stat-card');
      cards.forEach((card, index) => {
        setTimeout(() => {
          card.style.animationDelay = `${index * 0.1}s`;
        }, 100);
      });
